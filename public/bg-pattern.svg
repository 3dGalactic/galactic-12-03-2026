<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="80%" stop-color="#f8f9fa"/>
      <stop offset="100%" stop-color="#edf0f3"/>
    </linearGradient>
    <filter id="foldShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="-10" dy="14" stdDeviation="12" flood-color="#000000" flood-opacity="0.07"/>
    </filter>
  </defs>
  <rect width="1920" height="1080" fill="#f4f6f8"/>
  <g filter="url(#foldShadow)">
    <polygon points="-400,1400 300,-200 700,-200 0,1400" fill="url(#paperGrad)"/>
    <polygon points="0,1400 700,-200 1100,-200 400,1400" fill="url(#paperGrad)"/>
    <polygon points="400,1400 1100,-200 1500,-200 800,1400" fill="url(#paperGrad)"/>
    <polygon points="800,1400 1500,-200 1900,-200 1200,1400" fill="url(#paperGrad)"/>
    <polygon points="1200,1400 1900,-200 2300,-200 1600,1400" fill="url(#paperGrad)"/>
    <polygon points="1600,1400 2300,-200 2700,-200 2000,1400" fill="url(#paperGrad)"/>
  </g>
</svg>
